name: Build and Test OneView Banking API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run automated tests
        run: mvn -B clean test

      - name: Build Docker image
        run: docker build -t oneview-banking-api:latest .

      - name: Verify Docker container
        run: |
          docker run -d --name oneview-api -p 8080:8080 oneview-banking-api:latest

          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/api/spending/CUST001/total; then
              echo "API endpoint is responding"
              exit 0
            fi
            sleep 2
          done

          docker logs oneview-api
          exit 1
