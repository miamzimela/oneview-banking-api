# Isolated H2 database for automated tests
spring.datasource.url=jdbc:h2:mem:oneview_test_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create and remove database tables during tests
spring.jpa.hibernate.ddl-auto=create-drop

# Disable H2 web console during tests
spring.h2.console.enabled=false

# Reduce unnecessary SQL logging
spring.jpa.show-sql=false
